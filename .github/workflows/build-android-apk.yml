name: Build Audit Dashboard Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]   # every upload/commit builds a fresh APK

permissions:
  contents: write                # needed to publish the APK as a Release

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Accept licences and install exactly the SDK pieces the project asks for.
      # (Same versions as android/app/build.gradle: compileSdk 35, buildTools 35.0.0.)
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          echo "SDK_ROOT=$SDK_ROOT  SDKM=$SDKM"
          set +o pipefail
          yes | "$SDKM" --sdk_root="$SDK_ROOT" --licenses > /tmp/licences.log 2>&1 || true
          tail -3 /tmp/licences.log
          "$SDKM" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties

      # Safety net: always write the two correct Gradle files, even if a
      # build.gradle was uploaded to the wrong folder by mistake.
      - name: Write correct Gradle files
        run: |
          cat > android/build.gradle <<'EOF_ROOT'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF_ROOT
          cat > android/app/build.gradle <<'EOF_APP'
          plugins {
              id 'com.android.application'
          }

          def apkBuildNumber = (project.findProperty('apkVersionCode') ?: '2').toString().toInteger()

          android {
              namespace 'com.auditdashboard.mobile'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.auditdashboard.mobile'
                  minSdk 24
                  targetSdk 34
                  versionCode apkBuildNumber
                  versionName "1.1.${apkBuildNumber}"
              }

              // Signing key comes from GitHub Secrets (never stored in the repo).
              // Same key every build => a new APK installs OVER the old one.
              // If the secrets are not set, Gradle falls back to its own throwaway debug key.
              signingConfigs {
                  release {
                      def ksPath = System.getenv('KEYSTORE_FILE')
                      if (ksPath) {
                          storeFile file(ksPath)
                          storePassword System.getenv('KEYSTORE_PASSWORD')
                          keyAlias System.getenv('KEY_ALIAS')
                          keyPassword System.getenv('KEY_PASSWORD')
                      }
                  }
              }

              buildTypes {
                  debug {
                      if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
                  }
              }
          }
          EOF_APP
          echo "--- android/build.gradle"; cat android/build.gradle
          echo "--- android/app/build.gradle"; head -6 android/app/build.gradle

      - name: Load signing key from GitHub Secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No signing secrets set - using a temporary debug key."
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace --console=plain assembleDebug -PapkVersionCode=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-dashboard-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Stable download link: Releases > "Latest APK" (replaced on every build).
      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk audit-dashboard.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest audit-dashboard.apk \
            --title "Latest APK (build ${{ github.run_number }})" \
            --notes "Built from commit ${{ github.sha }}. Install audit-dashboard.apk on your phone." \
            --target "${{ github.sha }}"

      - name: Upload build reports (only if the build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/logs
          if-no-files-found: ignore
          retention-days: 7
