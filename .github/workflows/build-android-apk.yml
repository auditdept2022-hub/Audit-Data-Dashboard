name: Build Audit Dashboard Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Accept licences and install exactly the SDK pieces the project asks for.
      # (Same versions as android/app/build.gradle: compileSdk 35, buildTools 35.0.0.)
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          echo "SDK_ROOT=$SDK_ROOT  SDKM=$SDKM"
          set +o pipefail
          yes | "$SDKM" --sdk_root="$SDK_ROOT" --licenses > /tmp/licences.log 2>&1 || true
          tail -3 /tmp/licences.log
          "$SDKM" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace --console=plain assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-dashboard-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports (only if the build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/logs
          if-no-files-found: ignore
          retention-days: 7
