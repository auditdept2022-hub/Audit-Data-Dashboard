name: Build Audit Dashboard Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]   # every upload/commit builds a fresh APK

permissions:
  contents: write                # needed to publish the APK as a Release

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Accept licences and install exactly the SDK pieces the project asks for.
      # (Same versions as android/app/build.gradle: compileSdk 35, buildTools 35.0.0.)
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          echo "SDK_ROOT=$SDK_ROOT  SDKM=$SDKM"
          set +o pipefail
          yes | "$SDKM" --sdk_root="$SDK_ROOT" --licenses > /tmp/licences.log 2>&1 || true
          tail -3 /tmp/licences.log
          "$SDKM" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties

      # The repo now contains the correct android/build.gradle and android/app/build.gradle,
      # so nothing is overwritten at build time.

      - name: Load signing key from GitHub Secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets set - building a debug APK with a temporary key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Signed builds ship a non-debuggable RELEASE apk; without secrets we fall back to debug.
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            gradle --no-daemon --stacktrace --console=plain assembleRelease -PapkVersionCode=${{ github.run_number }}
            echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            gradle --no-daemon --stacktrace --console=plain assembleDebug -PapkVersionCode=${{ github.run_number }}
            echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-dashboard-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      # Stable download link: Releases > "Latest APK" (replaced on every build).
      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$APK_PATH" audit-dashboard.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest audit-dashboard.apk \
            --title "Latest APK (build ${{ github.run_number }})" \
            --notes "Built from commit ${{ github.sha }}. Install audit-dashboard.apk on your phone." \
            --target "${{ github.sha }}"

      - name: Upload build reports (only if the build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/logs
          if-no-files-found: ignore
          retention-days: 7
