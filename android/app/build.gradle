plugins {
    id 'com.android.application'
}

android {
    namespace 'com.auditdashboard.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.auditdashboard.mobile'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    // Fixed signing key so every build is signed the same way.
    // This lets a new APK install OVER the old one (no uninstall needed).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
